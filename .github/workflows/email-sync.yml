name: email-sync

on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch:

concurrency:
  group: email-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger /api/email/sync
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          EMAIL_SYNC_BEARER_TOKEN: ${{ secrets.EMAIL_SYNC_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_URL:-}" ] || [ -z "${EMAIL_SYNC_BEARER_TOKEN:-}" ]; then
            echo "Missing VERCEL_URL or EMAIL_SYNC_BEARER_TOKEN" >&2
            exit 1
          fi
          BASE="${VERCEL_URL%/}"
          case "$BASE" in
            http://*|https://*) ;;
            *) BASE="https://$BASE" ;;
          esac
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${EMAIL_SYNC_BEARER_TOKEN}" \
            -H "Content-Type: application/json" \
            "${BASE}/api/email/sync")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
